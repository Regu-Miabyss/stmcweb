<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — STCraft</title>
  <link rel="icon" type="image/svg+xml" href="images/4.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      text-align: center;
    }
    .box { padding: 40px 24px; }
    h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(48px, 10vw, 96px);
      color: #52c14a;
      margin: 0 0 18px;
      letter-spacing: 4px;
    }
    p { color: #8b98a8; margin: 0 0 30px; }
    a {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 10px;
      background: linear-gradient(180deg, #63cf5a, #2f7a2b);
      color: #07130a;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 0 #235c20;
    }
    a:active { transform: translateY(3px); box-shadow: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>这个页面被苦力怕炸飞了……</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
